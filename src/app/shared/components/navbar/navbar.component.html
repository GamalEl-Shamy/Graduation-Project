@if (menuOpen) {
<div (click)="closeMenu()"
    class="fixed inset-0 top-16 bottom-0 z-40 bg-black/70  md:hidden transition-opacity duration-300">
</div>
}
<nav class="fixed top-0 left-0 w-full z-50 bg-white/80 backdrop-blur-md shadow-md transition-all duration-300">
    <div class="container px-5 md:px-0 mx-auto py-3 flex items-center justify-between">

        <div class="flex items-center justify-between w-full md:w-auto">
            <a routerLink="/" class="flex items-center gap-2">
                <div class="w-10 h-10 bg-emerald-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">Z</div>
    <span class="text-xl font-bold text-slate-900 tracking-tight">Zaraa</span>
            </a>

            <button (click)="mobileToggle()"
                class="md:hidden  w-10 h-10 flex items-center justify-center cursor-pointer rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 transition-all duration-300">
                @if (isMobile) {
                <i class="fa-solid fa-bars text-lg"></i>
                } @else {
                <i class="fa-solid fa-xmark text-lg"></i>
                }
            </button>
        </div>

        <div [class.max-h-0]="isMobile" [class.max-h-screen]="!isMobile"
            class="links  overflow-hidden md:overflow-visible transition-all duration-500 ease-in-out md:flex md:items-center md:gap-10 md:max-h-full w-full md:w-auto bg-white md:bg-transparent absolute md:static left-0 top-full md:top-auto shadow-md md:shadow-none rounded-b-2xl md:rounded-none z-50">
            @if (authType == 'user') {
            <ul class="flex flex-col md:flex-row gap-4 p-5 md:p-0 text-gray-700 font-medium md:items-center">
                <li>
                    <a routerLinkActive="text-main font-bold" routerLink="/home" (click)="mobileToggle()"
                        class="hover:text-main transition">Home</a>
                </li>
                <li>
                    <a routerLinkActive="text-main font-bold" routerLink="/products" (click)="mobileToggle()"
                        class="hover:text-main transition">Products</a>
                </li>
                <li>
                    <a routerLinkActive="text-main font-bold" routerLink="/categories" (click)="mobileToggle()"
                        class="hover:text-main transition">Categories</a>
                </li>
                <li>
                    <a routerLinkActive="text-main font-bold" routerLink="/brands" (click)="mobileToggle()"
                        class="hover:text-main transition">Brands</a>
                </li>
            </ul>
            }

            <ul
                class="flex flex-col md:flex-row gap-4 p-5 md:p-0 border-t md:border-none text-gray-700 font-medium md:items-center">
                @if (authType == 'auth') {
                <div class="flex gap-4">
                    <li>
                        <a routerLink="/users" (click)="mobileToggle()"
                            class="text-slate-600 font-bold hover:text-emerald-600 transition-colors">
                            Login
                        </a>
                    </li>
                    <li>
                        <a routerLink="/users" (click)="mobileToggle()"
                            class="px-5 py-2.5 bg-emerald-600 text-white font-bold rounded-lg shadow-lg shadow-emerald-200 hover:bg-emerald-700 transition-all">
                            Join for Free
                        </a>
                    </li>
                </div>
                } @else {
                <li class="relative">
                    <a routerLinkActive="text-main font-bold bg-main/5" routerLink="/wishlist" (click)="mobileToggle()"
                        class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-main/5 transition">
                        <i class="fa-regular fa-heart text-red-500"></i>
                        <span>Wishlist</span>
                        <div
                            class="absolute -top-1 -right-2 flex items-center justify-center w-5 h-5 text-xs font-bold text-white bg-red-500 rounded-full shadow">
                            {{ wishlistCounter }}
                        </div>
                    </a>
                </li>
                <li class="relative">
                    <a routerLinkActive="text-main font-bold bg-main/5" routerLink="/cart" (click)="mobileToggle()"
                        class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-main/5 transition">
                        <i class="fa-solid fa-cart-shopping text-emerald-600"></i>
                        <span>Cart</span>
                        <div
                            class="absolute -top-1 -right-2 flex items-center justify-center w-5 h-5 text-xs font-bold text-white bg-red-500 rounded-full shadow">
                            {{ cartCounter }}
                        </div>
                    </a>
                </li>
                <li class="relative group w-full md:w-fit">
                    <button routerLink="/profile" (click)="mobileToggle()"
                        class="flex items-center gap-2 w-full mb-2 md:mb-0 md:w-fit px-3 py-2 rounded-lg bg-gray-100 border-2 border-gray-200 hover:border-main/50 transition cursor-pointer">
                        <div
                            class="w-9 h-9 rounded-full bg-main/10 flex items-center justify-center text-main font-serif font-bold text-lg">
                            {{ "G" | uppercase }}
                        </div>
                        <div class="text-left ">
                            <p class="font-semibold text-gray-800 leading-tight">
                                {{ "Gamal Elshamy" }}
                            </p>
                            <p class="text-xs text-gray-500">User</p>
                        </div>
                        <i
                            class="fa-solid fa-chevron-down text-sm text-gray-600 group-hover:-rotate-180 transition-all duration-300 opacity-0 md:opacity-100"></i>
                    </button>

                    <div
                        class="md:absolute  md:right-0 md:top-18 w-full md:w-52 bg-white shadow-lg rounded-xl border border-gray-100 md:opacity-0 md:invisible group-hover:opacity-100 group-hover:visible transition-all duration-300">
                        <ul class="py-2 text-gray-700">
                            <li>
                                <a routerLinkActive="text-main font-bold" routerLink="/allorders"
                                    (click)="mobileToggle()"
                                    class="flex items-center gap-2 px-4 py-2 hover:bg-gray-50 transition">
                                    <i class="fa-solid fa-bag-shopping text-teal-500"></i>
                                    <span>Your Orders</span>
                                </a>
                            </li>
                            <li>
                                <a routerLinkActive="text-main font-bold" routerLink="/profile" (click)="mobileToggle()"
                                    class="flex items-center gap-2 px-4 py-2 hover:bg-gray-50 transition">
                                    <i class="fa-solid fa-user text-teal-500"></i>
                                    <span>Profile Settings</span>
                                </a>
                            </li>
                            <li>
                                <hr class="my-1 border-gray-100" />
                            </li>
                            <li>
                                <button (click)="mobileToggle()"
                                    class="w-full text-left flex items-center gap-2 px-4 py-2 hover:bg-red-50 transition cursor-pointer">
                                    <i class="fa-solid fa-right-from-bracket text-red-500"></i>
                                    <span class="text-red-600">Logout</span>
                                </button>
                            </li>
                        </ul>
                    </div>
                </li>

                }
            </ul>
        </div>
    </div>
</nav>
