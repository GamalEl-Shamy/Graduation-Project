<section class="min-h-screen bg-slate-50 dark:bg-slate-900 font-sans xl:flex">

    <app-user-sidebar [char]="char" [userFirstName]="userFirstName" [userRole]="userRole" [isSidebarOpen]="isSidebarOpen()"></app-user-sidebar>

    <main class="flex-1 flex flex-col transform transition-all duration-500 ease-in-out relative">
        <div class="sticky top-0 z-200 transition-all duration-300 delay-75 ease-in-out "
        [class.-translate-y-full]="!isVisible()" [class.translate-y-0]="isVisible()">
            <app-user-header [char]="char" [userFirstName]="userFirstName" [userRole]="userRole"
                (closeSidebarEvent)="closeSidebar()" (toggleSidebarEvent)="toggleSidebar()"></app-user-header>
        </div>

        <div
            class="flex-1 mt-15 md:mt-0 p-4 sm:p-6 lg:p-10 lg:pt-6 w-full mx-auto bg-slate-50 dark:bg-slate-800 transform transition-all duration-500 ease-in-out">
            <!-- <app-ambient-background></app-ambient-background> -->
            <router-outlet></router-outlet>
        </div>
        <app-footer class="mt-auto shrink-0"></app-footer>
    </main>
</section>
