@for (i of [1, 2, 3, 4]; track i) {
<div
    class="group relative bg-white/60 backdrop-blur-sm rounded-4xl p-5 my-5 border border-white/80 shadow-lg shadow-slate-200/40 flex flex-col md:flex-row items-center gap-6 overflow-hidden">

    <div class="relative w-full md:w-36 h-48 md:h-36 shrink-0 rounded-3xl overflow-hidden bg-slate-100/50 flex">
        <div class="w-full h-full bg-slate-200/60 animate-pulse"></div>
    </div>

    <div class="flex-1 text-center md:text-left min-w-0 z-10 w-full outline-hidden">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 mb-2">
            <div class="flex flex-wrap items-center justify-center md:justify-start gap-3 w-full md:w-auto">
                <div class="w-32 md:w-48 h-8 bg-slate-200/60 animate-pulse rounded-xl"></div>
                <div class="w-16 h-6 bg-slate-200/60 animate-pulse rounded-lg"></div>
            </div>
            <div class="w-24 h-6 bg-slate-200/60 animate-pulse rounded-lg mx-auto md:mx-0 mt-2 md:mt-0"></div>
        </div>
        <div class="w-48 md:w-64 h-4 bg-slate-200/60 animate-pulse rounded-lg mt-3 mx-auto md:mx-0"></div>
        <div class="w-32 md:w-40 h-4 bg-slate-200/60 animate-pulse rounded-lg mt-2 mx-auto md:mx-0"></div>
    </div>

    <div
        class="flex flex-col sm:flex-row md:flex-col items-center justify-between gap-4 shrink-0 w-full md:w-48 z-10 p-4 md:p-0 bg-slate-50/50 md:bg-transparent rounded-2xl md:rounded-none md:border-l border-slate-200/50 md:pl-6">
        <div class="flex flex-col items-center md:items-end w-full gap-2">
            <div class="flex justify-between w-full md:justify-end items-center gap-3">
                <div class="w-16 h-3 bg-slate-200/60 animate-pulse rounded-full"></div>
                <div class="w-8 h-4 bg-slate-200/60 animate-pulse rounded-md"></div>
            </div>
            <div class="w-full h-2.5 bg-slate-200/60 animate-pulse rounded-full"></div>
        </div>
        <div class="flex items-center gap-3 w-full justify-between md:justify-end mt-2 md:mt-4">
            <div class="w-20 h-6 bg-slate-200/60 animate-pulse rounded-lg flex-1 md:flex-none"></div>
            <div class="w-12 h-12 bg-slate-200/60 animate-pulse rounded-2xl flex-none"></div>
        </div>
    </div>
</div>
}
