<div class="relative w-full bg-white/80 backdrop-blur-xl rounded-3xl mb-5 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/50 overflow-hidden">
    <div class="py-3 w-full bg-slate-200 relative overflow-hidden h-19 sm:h-22 animate-pulse">
        <div class="flex items-center justify-center h-full">
            <div class="h-8 md:h-10 w-48 bg-slate-300 rounded-lg"></div>
        </div>
    </div>

    <div class="flex flex-col lg:flex-row gap-8 p-6 sm:p-8">
        <div class="flex-1 space-y-5">
            @for (item of [1,2,3]; track $index) {
                <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5 flex flex-col sm:flex-row items-start sm:items-center gap-6 animate-pulse">
                <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-xl bg-slate-200 shrink-0"></div>
                <div class="flex-1 w-full">
                    <div class="flex justify-between items-start">
                        <div class="h-5 w-48 max-w-[70%] bg-slate-300 rounded-md"></div>
                        <div class="h-5 w-16 bg-slate-300 rounded-md"></div>
                    </div>
                    <div class="flex items-center justify-between mt-8">
                        <div class="h-10 w-28 bg-slate-200 rounded-full"></div>
                        <div class="h-8 w-24 bg-slate-200 rounded-lg"></div>
                    </div>
                </div>
            </div>
            }
        </div>

        <div class="w-full lg:w-95">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 sm:p-8 sticky top-8 animate-pulse">
                <div class="h-6 w-40 bg-slate-300 rounded-md mb-6"></div>
                <div class="space-y-4">
                    <div class="flex justify-between items-center">
                        <div class="h-4 w-32 bg-slate-200 rounded"></div>
                        <div class="h-4 w-12 bg-slate-300 rounded"></div>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="h-4 w-24 bg-slate-200 rounded"></div>
                        <div class="h-4 w-16 bg-slate-300 rounded"></div>
                    </div>
                    
                    <div class="pt-4 mt-2 border-t border-slate-100 border-dashed">
                        <div class="flex justify-between items-center mb-3">
                            <div class="h-4 w-16 bg-slate-200 rounded"></div>
                            <div class="h-4 w-16 bg-slate-300 rounded"></div>
                        </div>
                        <div class="flex justify-between items-center">
                            <div class="h-4 w-16 bg-slate-200 rounded"></div>
                            <div class="h-6 w-12 bg-slate-200 rounded-md"></div>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between items-end mt-6 pt-6 border-t border-slate-100">
                    <div class="h-5 w-12 bg-slate-200 rounded"></div>
                    <div class="h-8 w-24 bg-slate-300 rounded"></div>
                </div>

                <div class="mt-8 w-full h-15 bg-slate-300 rounded-xl"></div>
            </div>
        </div>
    </div>
</div>
