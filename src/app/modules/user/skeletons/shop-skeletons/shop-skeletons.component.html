<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
    @for (i of [1, 2, 3, 4, 5, 6, 7, 8]; track i) {
    <div
        class="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-[0_8px_30px_rgba(0,0,0,0.04)] flex flex-col">

        <div class="relative aspect-4/5 overflow-hidden bg-[#f8faf9] p-6">
            <div class="w-full h-full bg-slate-200/50 rounded-2xl animate-pulse"></div>
        </div>

        <div class="p-8 flex-1 flex flex-col bg-white">
            
            <div class="w-20 h-3 bg-slate-200/60 rounded-full animate-pulse mb-5"></div>

            <div class="w-full h-8 bg-slate-200/60 rounded-xl animate-pulse mb-3"></div>
            <div class="w-2/3 h-8 bg-slate-200/60 rounded-xl animate-pulse mb-6"></div>

            <div class="mt-auto flex items-end justify-between pt-6 border-t border-slate-100/60 w-full">
                <div class="flex flex-col gap-2">
                    <div class="w-12 h-3 bg-slate-200/60 rounded-full animate-pulse"></div>
                    <div class="w-24 h-8 bg-slate-200/60 rounded-xl animate-pulse"></div>
                </div>

                <div class="w-28 h-12 bg-slate-200/60 rounded-xl animate-pulse"></div>
            </div>
        </div>
    </div>
    }
</div>
