<section 
    class="relative overflow-hidden bg-[#020e0a] p-8 md:p-14 rounded-4xl text-white mb-10 w-full shadow-[0_24px_60px_-15px_rgba(0,0,0,0.7)] bg-[url('/images/e-commerce-background.png')] bg-cover bg-center bg-no-repeat transition-all duration-500 animate-pulse">
    <!-- Overlay -->
    <div class="absolute inset-0 bg-linear-to-b md:bg-linear-to-br from-[#0b1f16]/90 via-[#123524]/50 to-[#d4b15a]/20">
    </div>
    <div class="absolute -top-32 -left-24 w-md h-112 rounded-full bg-lime-400/10 blur-[140px] pointer-events-none">
    </div>
    <div class="absolute top-0 left-1/3 w-88 h-88 rounded-full bg-amber-300/10 blur-[120px] pointer-events-none">
    </div>
    <div class="absolute bottom-0 right-0 w-120 h-120 rounded-full bg-sky-300/8 blur-[150px] pointer-events-none">
    </div>
    <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-12 max-w-6xl mx-auto">
        <!-- LEFT: Text content skeleton -->
        <div class="flex flex-col items-center md:items-start text-center md:text-left flex-1 w-full min-w-0">
            <!-- Subtitle Badge Skeleton -->
            <div
                class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 backdrop-blur-md border border-white/10 mb-6 shadow-sm">
                <span class="w-2.5 h-2.5 rounded-full bg-[#c1ecd4]/20 relative flex">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 bg-[#c1ecd4]/15"></span>
                    <span class="relative inline-flex rounded-full h-full w-full bg-[#c1ecd4]/25"></span>
                </span>
                <span class="inline-block h-3.5 w-20 bg-[#c1ecd4]/15 rounded-md"></span>
            </div>
            <!-- Title Heading Skeleton -->
            <div class="flex flex-col items-center md:items-start gap-3 mb-6 w-full">
                <span class="h-10 lg:h-14 bg-gradient-to-r from-emerald-400/25 via-[#c1ecd4]/20 to-teal-400/25 rounded-2xl w-64 lg:w-80"></span>
                <span class="h-10 lg:h-14 bg-white/10 rounded-2xl w-44 lg:w-56"></span>
            </div>
            <!-- Paragraph Text Lines Skeleton -->
            <div class="space-y-3.5 w-full max-w-lg mb-8 flex flex-col items-center md:items-start">
                <div class="h-4 bg-white/10 rounded-md w-full"></div>
                <div class="h-4 bg-white/10 rounded-md w-11/12"></div>
                <div class="h-4 bg-white/10 rounded-md w-2/3"></div>
            </div>
            <!-- Button Skeleton -->
            <div class="w-full sm:w-44 h-12 bg-white/10 rounded-xl"></div>
        </div>
        <!-- RIGHT: Animated Basket Icon Skeleton -->
        <div class="relative w-40 h-40 md:w-56 md:h-56 shrink-0 flex items-center justify-center">
            <div
                class="absolute inset-0 bg-linear-to-tr from-[#c1ecd4]/10 to-transparent rounded-[3rem] rotate-12 backdrop-blur-xs border border-white/5">
            </div>
            <div
                class="absolute inset-0 bg-linear-to-bl from-white/5 to-transparent rounded-[3rem] -rotate-6 backdrop-blur-xs border border-white/10 shadow-2xl flex items-center justify-center">
                <div class="w-24 h-24 md:w-32 md:h-32 rounded-full bg-[#c1ecd4]/10 flex items-center justify-center">
                    <i class="fa-solid fa-basket-shopping text-6xl md:text-8xl text-[#c1ecd4]/15 animate-pulse"></i>
                </div>
            </div>
        </div>
    </div>
</section>

<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
    @for (i of [1, 2, 3, 4, 5, 6, 7, 8]; track i){

    <div class="group bg-white dark:bg-slate-800 rounded-3xl overflow-hidden
         border border-slate-100 dark:border-white/10
         shadow-[0_8px_30px_rgba(0,0,0,0.04)] dark:shadow-[0_0_25px_rgba(255,255,255,0.05)]
         dark:ring-1 dark:ring-white/5
         flex sm:flex-col">

        <!-- ─── Image area ─────────────────────────────────────────── -->
        <div class="relative w-28 h-28 my-auto sm:w-full sm:aspect-4/5 sm:h-auto
              bg-slate-100 dark:bg-slate-900/60 p-1 sm:p-6 flex-shrink-0 overflow-hidden">

            <!-- Centre image placeholder -->
            <div class="w-full h-full rounded-2xl
                bg-slate-200 dark:bg-slate-700/50 animate-pulse"></div>
        </div>

        <!-- ─── Content area ──────────────────────────────────────── -->
        <div class="relative p-8 pt-2 lg:pt-8 flex-1 flex flex-col bg-white dark:bg-slate-800 ">

            <!-- Product name — 2 lines -->
            <div class="space-y-2 mb-2">
                <div class="h-5 w-4/5 rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse"></div>
                <div class="h-5 w-3/5 rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse"></div>
            </div>

            
            <!-- Price section -->
            <div class="hidden md:block mt-auto pt-4 lg:pt-6 
                border-t border-slate-100/60 dark:border-slate-700/50 w-full">

                <!-- "Price" label -->
                <div class="h-2.5 w-10 rounded bg-slate-200 dark:bg-slate-600 animate-pulse mb-2"></div>

                <!-- Price value -->
                <div class="h-7 w-24 rounded-lg bg-slate-200 dark:bg-slate-700 animate-pulse ml-2.5"></div>
            </div>

            <!-- Add to cart button -->
            <div class="mt-3 h-[52px] w-full rounded-xl
                bg-slate-200 dark:bg-slate-700/60 animate-pulse">
            </div>
        </div>
    </div>

    }
</div>
