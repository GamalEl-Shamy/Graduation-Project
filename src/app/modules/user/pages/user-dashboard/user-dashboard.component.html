@if (WelcomeCardState()) {
    <app-welcome-message (onDismiss)="closeWelcomeMessage()"></app-welcome-message>
}

<section >
    <div class="mt-0">
        <app-welcome></app-welcome>
    </div>

    <div class="mt-8">
        <app-whether-section [isDashboard]="true"></app-whether-section>
    </div>

    <div class="my-8">
        <app-overview></app-overview>
    </div>

    <div class="my-8">
        <app-garden-insights></app-garden-insights>
    </div>
</section>
