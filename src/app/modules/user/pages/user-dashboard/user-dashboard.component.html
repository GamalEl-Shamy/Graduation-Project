@if (WelcomeCardState()) {
    <app-welcome-message (onDismiss)="closeWelcomeMessage()"></app-welcome-message>
}

<section class="space-y-8 animate-in fade-in duration-700">
    <div class="mt-0">
        <app-welcome></app-welcome>
    </div>

    <div class="mt-7">
        <app-environment [isDashboard]="true"></app-environment>
    </div>

    <div class="my-7">
        <app-overview></app-overview>
    </div>

    <div class="my-7">
        <app-garden-insights></app-garden-insights>
    </div>
</section>
