<div class="space-y-8 animate-in fade-in slide-in-from-bottom-6 duration-1000">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-6">
        <div>
            <h2 class="text-3xl font-black text-slate-800 tracking-tight">
                My <span class="text-emerald-600">Garden</span>
            </h2>
            <!-- <p class="text-sm font-medium text-slate-500">Manage and monitor your 3 registered plant crops.</p> -->
        </div>
        <!-- <button class="px-6 py-4 bg-slate-900 text-white font-black rounded-2xl shadow-xl shadow-slate-200 hover:bg-emerald-600 transition-all flex items-center gap-3 active:scale-95">
      <i class="fa-solid fa-plus"></i>
      Add New Plant
    </button> -->
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-8">
        @for (plant of myPlants(); track plant.id) {
        <div
            class="group bg-white rounded-[2.5rem] p-6 border border-slate-50 shadow-sm hover:shadow-2xl hover:shadow-emerald-500/5 transition-all duration-500">
            <div class="relative aspect-video rounded-[2rem] overflow-hidden mb-6 shadow-inner">
                <img [src]="plant.img" [alt]="plant.name"
                    class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                <div class="absolute top-4 left-4">
                    <span [class]="getStatusColor(plant.status)"
                        class="px-3 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest shadow-sm">
                        {{ plant.status }}
                    </span>
                </div>
            </div>

            <div class="space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-xl font-black text-slate-800 tracking-tight">{{ plant.name }}</h3>
                    <span
                        class="text-[10px] font-bold text-slate-400 uppercase tracking-widest bg-slate-50 px-2 py-1 rounded-md">{{
                        plant.species }}</span>
                </div>

                <div class="space-y-2">
                    <div class="flex justify-between items-center text-[10px] font-black uppercase tracking-widest">
                        <span class="text-slate-400">Health Score</span>
                        <span [class]="plant.healthScore > 50 ? 'text-emerald-600' : 'text-red-500'">{{
                            plant.healthScore }}%</span>
                    </div>
                    <div class="h-2 w-full bg-slate-100 rounded-full overflow-hidden">
                        <div class="h-full transition-all duration-1000" [style.width.%]="plant.healthScore" [class]="
                  plant.healthScore > 80
                    ? 'bg-emerald-500'
                    : plant.healthScore > 50
                      ? 'bg-amber-400'
                      : 'bg-red-500'
                "></div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4 pt-4 border-t border-slate-50">
                    <div class="flex items-center gap-3">
                        <div
                            class="w-8 h-8 bg-blue-50 text-blue-500 rounded-xl flex items-center justify-center text-xs">
                            <i class="fa-solid fa-droplet"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-[9px] font-black text-slate-400 uppercase">Last Watered</span>
                            <span class="text-xs font-bold text-slate-700">{{ plant.lastWatered }}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 justify-end">
                        <button
                            class="w-10 h-10 bg-slate-50 text-slate-400 rounded-xl flex items-center justify-center hover:bg-emerald-600 hover:text-white transition-all">
                            <i class="fa-solid fa-chart-line"></i>
                        </button>
                        <button
                            class="w-10 h-10 bg-slate-50 text-slate-400 rounded-xl flex items-center justify-center hover:bg-red-50 hover:text-red-500 transition-all">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        }
    </div>
</div>

<div class="flex flex-col items-center justify-center h-64">
    <div class="w-16 h-16 border-4 border-emerald-200 border-t-emerald-600 rounded-full animate-spin"></div>
    <p class="mt-6 text-slate-600 font-medium">Soon...</p>
</div>
