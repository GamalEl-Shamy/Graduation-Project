<div class="mb-8 text-center">
    <p class="text-xs font-medium tracking-widest uppercase text-emerald-600 mb-2">Step 2 of 3</p>
    <h1 class="text-2xl lg:text-4xl font-bold text-gray-900">Shipping Information</h1>
    <p class="text-sm text-gray-500 mt-1">Enter your delivery details to continue to payment.</p>
</div>

<div class="flex items-center justify-center gap-2 mb-10">
    <div class="flex items-center gap-2">
        <div
            class="w-7 h-7 rounded-full bg-emerald-600 flex items-center justify-center text-white text-xs font-semibold">
            ✓</div>
        <span class="text-sm font-medium text-emerald-600 hidden sm:block">Cart</span>
    </div>
    <div class="h-px w-10 bg-emerald-300"></div>
    <div class="flex items-center gap-2">
        <div
            class="w-7 h-7 rounded-full bg-emerald-600 flex items-center justify-center text-white text-xs font-semibold">
            2</div>
        <span class="text-sm font-medium text-emerald-600 hidden sm:block">Data confirmation</span>
    </div>
    <div class="h-px w-10 bg-gray-200"></div>
    <div class="flex items-center gap-2">
        <div
            class="w-7 h-7 rounded-full bg-gray-200 flex items-center justify-center text-gray-400 text-xs font-semibold">
            3</div>
        <span class="text-sm font-medium text-gray-400 hidden sm:block">Payment</span>
    </div>
</div>
<div class="max-w-6xl mx-auto flex flex-col lg:flex-row gap-8">

    <div class="flex-1">
        @if (userProfile()) {
        <app-profile-edit [profile]="userProfile()!" [isShopping]="true" [isShoppingComponent]="true"
            [isSaving]="isSubmitting()" (cancelRequest)="isEditingMode.set(false)" (saveRequest)="handleSave($event)">
        </app-profile-edit>
        }
    </div>

    <div class="w-full lg:w-96">
        <app-order-summary [isActive]="false"></app-order-summary>
    </div>

</div>

@if(errorMessage()) {
<app-toast [errorMessage]="errorMessage()!"></app-toast>
}
