<aside
    class="fixed inset-y-0 z-500 overflow-hidden whitespace-nowrap xl:sticky h-screen xl:top-0 bg-white/95 dark:bg-slate-950/95  border-slate-200/70 dark:border-slate-800/70 transform transition-all duration-500 ease-in-out shadow-[4px_0_24px_rgba(0,0,0,0.02)] dark:shadow-[4px_0_24px_rgba(0,0,0,0.2)] flex flex-col shrink-0 font-body"
    [class]="{ 
            'xl:w-75': isSidebarOpen(),
            'xl:w-0': !isSidebarOpen(),
            'border-r': isSidebarOpen(),
            'border-r-0': !isSidebarOpen(),
            'left-0': !isSidebarOpen(),
            '-left-full': isSidebarOpen()
            }">

    <div class="flex flex-col h-full p-5 gap-y-2">
        <!-- Header / Logo -->
        <div class="mb-6 px-2 flex items-center justify-between shrink-0">
            <div routerLink="/users/dashboard"
                class="group flex items-center gap-3 w-full h-20 px-5 py-2 cursor-pointer rounded-lg hover:scale-105 hover:bg-slate-100 dark:hover:bg-green-800/35 dark:hover:border dark:hover:border-green-800  transition-all duration-300">
                <img src="./logos/zaraa.png" alt="Zaraa Logo"
                    class="h-full w-auto object-contain transition-all duration-400 dark:filter dark:brightness-0 dark:invert">
            </div>
            <button (click)="toggleSidebar()"
                class=" text-slate-400 dark:text-slate-500 hover:text-slate-800 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl cursor-pointer p-2.5 -mr-2 transition-all duration-300">
                <i class="fa-solid fa-xmark text-xl w-5 flex justify-center"></i>
            </button>
        </div>

        <button (click)="themeService.toggleTheme()"
            class="relative flex items-center w-16 h-8 p-1 rounded-full cursor-pointer mx-auto bg-slate-200 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 transition-colors duration-300 shadow-inner group focus:outline-none focus:ring-2 focus:ring-emerald-500/50"
            aria-label="Toggle Theme">
            <div class="absolute left-0 right-0 flex justify-between px-2 pointer-events-none">
                <i
                    class="fa-solid fa-sun text-[13px] text-amber-500/70 dark:text-slate-500 transition-colors duration-300"></i>
                <i
                    class="fa-solid fa-moon text-[13px] text-slate-400 dark:text-emerald-400/70 transition-colors duration-300"></i>
            </div>

            <div class="relative z-10 flex items-center justify-center w-6 h-6 rounded-full bg-white dark:bg-slate-900 shadow-sm border border-slate-200 dark:border-slate-700 transition-transform duration-500 cubic-bezier(0.4, 0, 0.2, 1)"
                [class.translate-x-8]="themeService.isDarkMode()">
                @if (themeService.isDarkMode()) {
                <i class="fa-solid fa-moon text-[11px] text-emerald-400 animate-fade-in"></i>
                } @else {
                <i class="fa-solid fa-sun text-[11px] text-amber-500 animate-fade-in"></i>
                }
            </div>
        </button>

        <nav class="flex-1 flex flex-col gap-y-2 overflow-x-clip overflow-y-auto px-2 mt-3 -mx-2 custom-scrollbar">

            <button (click)="closeSidebar()" routerLink="dashboard"
                routerLinkActive="bg-emerald-600 text-white font-bold translate-x-1 ring-1 ring-emerald-100/50 dark:!bg-emerald-600 dark:!text-white dark:ring-emerald-500/20 is-active"
                class="group flex items-center gap-3 px-4 py-3 cursor-pointer text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/60 hover:text-emerald-600 dark:hover:text-emerald-400 font-body text-sm font-medium transition-all duration-200 hover:translate-x-1 rounded-xl">
                <i
                    class="fa-solid fa-gauge-high w-5 flex justify-center text-lg text-slate-400 dark:text-slate-500 group-[.is-active]:text-white/70 group-hover:text-emerald-500! dark:group-hover:text-emerald-400 transition-colors"></i>
                <span>Dashboard</span>
            </button>

            <button (click)="closeSidebar()" routerLink="diagnosis"
                routerLinkActive="bg-emerald-600 text-white font-bold translate-x-1 ring-1 ring-emerald-100/50 dark:!bg-emerald-600 dark:!text-white dark:ring-emerald-500/20 is-active"
                class="group flex items-center gap-3 px-4 py-3 cursor-pointer text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/60 hover:text-emerald-600 dark:hover:text-emerald-400 font-body text-sm font-medium transition-all duration-200 hover:translate-x-1 rounded-xl">
                <i
                    class="fa-solid fa-camera-retro w-5 flex justify-center text-lg text-slate-400 dark:text-slate-500 group-[.is-active]:text-white/70 group-hover:text-emerald-500! dark:group-hover:text-emerald-400 transition-colors"></i>
                <span>New Diagnosis</span>
            </button>

            <button (click)="closeSidebar()" routerLink="weather"
                routerLinkActive="bg-emerald-600 text-white font-bold translate-x-1 ring-1 ring-emerald-100/50 dark:!bg-emerald-600 dark:!text-white dark:ring-emerald-500/20 is-active"
                class="group flex items-center gap-3 px-4 py-3 cursor-pointer text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/60 hover:text-emerald-600 dark:hover:text-emerald-400 font-body text-sm font-medium transition-all duration-200 hover:translate-x-1 rounded-xl">
                <i
                    class="fa-solid fa-cloud-moon w-5 flex justify-center text-lg text-slate-400 dark:text-slate-500 group-[.is-active]:text-white/70 group-hover:text-emerald-500! dark:group-hover:text-emerald-400 transition-colors"></i>
                <span>Weather</span>
            </button>

            <button (click)="closeSidebar()" routerLink="my-garden"
                routerLinkActive="bg-emerald-600 text-white font-bold translate-x-1 ring-1 ring-emerald-100/50 dark:!bg-emerald-600 dark:!text-white dark:ring-emerald-500/20 is-active"
                class="group flex items-center gap-3 px-4 py-3 cursor-pointer text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/60 hover:text-emerald-600 dark:hover:text-emerald-400 font-body text-sm font-medium transition-all duration-200 hover:translate-x-1 rounded-xl">
                <i
                    class="fa-solid fa-seedling w-5 flex justify-center text-lg text-slate-400 dark:text-slate-500 group-[.is-active]:text-white/70 group-hover:text-emerald-500! dark:group-hover:text-emerald-400 transition-colors"></i>
                <span>My Garden</span>
            </button>

            <button (click)="closeSidebar()" routerLink="shop"
                routerLinkActive="bg-emerald-600 text-white font-bold translate-x-1 ring-1 ring-emerald-100/50 dark:!bg-emerald-600 dark:!text-white dark:ring-emerald-500/20 is-active"
                class="group flex items-center gap-3 px-4 py-3 cursor-pointer text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/60 hover:text-emerald-600 dark:hover:text-emerald-400 font-body text-sm font-medium transition-all duration-200 hover:translate-x-1 rounded-xl">
                <i
                    class="fa-solid fa-cart-shopping w-5 flex justify-center text-lg text-slate-400 dark:text-slate-500 group-[.is-active]:text-white/70 group-hover:text-emerald-500! dark:group-hover:text-emerald-400 transition-colors"></i>
                <span>Shop</span>
            </button>

            <button (click)="closeSidebar()" routerLink="cart"
                routerLinkActive="bg-emerald-600 text-white font-bold translate-x-1 ring-1 ring-emerald-100/50 dark:!bg-emerald-600 dark:!text-white dark:ring-emerald-500/20 is-active"
                class="group flex items-center gap-3 px-4 py-3 cursor-pointer text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/60 hover:text-emerald-600 dark:hover:text-emerald-400 font-body text-sm font-medium transition-all duration-200 hover:translate-x-1 rounded-xl">
                <i
                    class="fa-solid fa-cart-shopping w-5 flex justify-center text-lg text-slate-400 dark:text-slate-500 group-[.is-active]:text-white/70 group-hover:text-emerald-500! dark:group-hover:text-emerald-400 transition-colors"></i>
                <span>Cart</span>
            </button>

            <button (click)="closeSidebar()" routerLink="diagnosis-history"
                routerLinkActive="bg-emerald-600 text-white font-bold translate-x-1 ring-1 ring-emerald-100/50 dark:!bg-emerald-600 dark:!text-white dark:ring-emerald-500/20 is-active"
                class="group flex items-center gap-3 px-4 py-3 cursor-pointer text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-800/60 hover:text-emerald-600 dark:hover:text-emerald-400 font-body text-sm font-medium transition-all duration-200 hover:translate-x-1 rounded-xl">
                <i
                    class="fa-solid fa-history w-5 flex justify-center text-lg text-slate-400 dark:text-slate-500 group-[.is-active]:text-white/70 group-hover:text-emerald-500! dark:group-hover:text-emerald-400 transition-colors"></i>
                <span>Diagnosis History</span>
            </button>
        </nav>

        <!-- Actions & Profile Footer -->
        <div
            class="mt-auto pt-6 border-t border-slate-200/70 dark:border-slate-800/70 shrink-0 flex flex-col gap-3 pb-2">
            <div routerLink="/users/settings" (click)="closeSidebar()"
                class="group relative flex items-center gap-3 p-3 mt-1 bg-white dark:bg-slate-900 rounded-2xl hover:bg-slate-50 dark:hover:bg-slate-800 transition-all duration-300 cursor-pointer border border-slate-200/70 dark:border-slate-700/70 shadow-sm hover:shadow-md hover:-translate-y-0.5 overflow-hidden">

                <div
                    class="absolute inset-0 bg-linear-to-r from-emerald-500/0 via-emerald-500/5 to-emerald-500/0 -translate-x-full group-hover:translate-x-full transition-transform duration-1000">
                </div>

                <div
                    class="relative w-12 h-12 rounded-xl bg-linear-to-br from-emerald-400 to-emerald-600 flex items-center justify-center text-white font-bold text-xl shrink-0 leading-none shadow-inner shadow-white/20 font-['Namdhinggo'!important] capitalize ring-2 ring-emerald-100 dark:ring-emerald-900/50">
                    <span>{{char()}}</span>
                </div>

                <div class="flex-1 min-w-0 relative">
                    <p
                        class="text-base capitalize font-bold text-slate-800 dark:text-slate-100 truncate font-headline leading-tight group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors font-['Namdhinggo'!important]">
                        {{ userFirstName() }}
                    </p>
                    <p
                        class="text-[11px] uppercase tracking-wider text-slate-500 dark:text-slate-400 font-semibold truncate mt-1 flex items-center gap-1.5">
                        <span
                            class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)] animate-pulse"></span>
                        {{ userRole() }}
                    </p>
                </div>

                <div
                    class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 dark:text-slate-500 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 group-hover:bg-emerald-50 dark:group-hover:bg-emerald-500/10 transition-all duration-300 relative">
                    <i class="fa-solid fa-gear group-hover:rotate-90 transition-transform duration-500"></i>
                </div>
            </div>

            <button (click)="authService.logout()"
                class="group relative flex items-center justify-center cursor-pointer gap-2.5 w-full py-3.5 bg-rose-50 dark:bg-rose-500/10 rounded-2xl hover:bg-rose-100 dark:hover:bg-rose-500/20 transition-all duration-300 border border-rose-200/50 dark:border-rose-500/20 hover:shadow-sm overflow-hidden">
                <div
                    class="absolute inset-0 bg-linear-to-r from-rose-500/5 to-orange-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-500">
                </div>
                <i
                    class="fa-solid fa-arrow-right-from-bracket text-rose-600 dark:text-rose-400 group-hover:-translate-x-1 transition-transform duration-300"></i>
                <span class="font-semibold text-sm text-rose-700 dark:text-rose-300">Sign Out</span>
            </button>

        </div>
    </div>
</aside>


<button (click)="toggleSidebar()"
    class="fixed top-2 xl:block z-201 p-2.5 bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10 text-slate-600 dark:text-slate-100 rounded-r-full cursor-pointer hover:bg-slate-50 dark:hover:bg-white/5 hover:text-emerald-600 dark:hover:text-emerald-400 transition-all delay-100 duration-500 ease-in-out"
    [class]="{ 
                '-left-full': isSidebarOpen(), 
                'left-0': !isSidebarOpen(),
        }">
    <i class="fa-solid fa-angles-left transform transition-all duration-500 ease-in-out" [class]="{ 
                'rotate-0': isSidebarOpen(), 
                'rotate-180': !isSidebarOpen(),
        }"></i>
</button>

@if (!isSidebarOpen()) {
<div (click)="closeSidebar()"
    class="fixed inset-0 bg-slate-900/60 dark:bg-black/50 z-400 xl:hidden transition-all duration-300"></div>
}
