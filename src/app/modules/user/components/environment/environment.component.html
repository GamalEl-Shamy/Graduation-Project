<div class="space-y-6">
    <div class="flex items-center justify-between mb-4">
        <div>
            <h2 class="text-xl lg:text-3xl  font-black text-slate-800 tracking-tight">Environmental Metrics</h2>
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-1">Real-time garden conditions</p>
        </div>
        <div class="px-3 py-1 bg-white border border-slate-100 rounded-lg shadow-sm flex items-center gap-2">
            <i class="fa-solid fa-location-dot text-emerald-500 text-xs"></i>
            <span class="text-[10px] font-black text-slate-500 uppercase tracking-tighter">Kafr El-Shaikh, EG</span>
        </div>
    </div>

    <div class="grid grid-cols-2 lg:grid-cols-4 gap-6">

        <div
            class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm hover:shadow-xl hover:shadow-orange-500/5 transition-all group">
            <div
                class="w-12 h-12 bg-orange-50 text-orange-500 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                <i class="fa-solid fa-temperature-high text-xl"></i>
            </div>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Temperature</p>
            <div class="flex items-baseline gap-1">
                <p class="text-3xl font-black text-slate-800">28°C</p>
                <span class="text-slate-400 text-xs font-bold">Optimal</span>
            </div>
        </div>

        <div
            class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm hover:shadow-xl hover:shadow-blue-500/5 transition-all group">
            <div
                class="w-12 h-12 bg-blue-50 text-blue-500 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                <i class="fa-solid fa-droplet text-xl"></i>
            </div>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Air Humidity</p>
            <p class="text-3xl font-black text-slate-800">64%</p>
        </div>

        <div
            class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm hover:shadow-xl hover:shadow-slate-500/5 transition-all group">
            <div
                class="w-12 h-12 bg-slate-50 text-slate-600 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                <i class="fa-solid fa-wind text-xl"></i>
            </div>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Wind Speed</p>
            <div class="flex items-baseline gap-1">
                <p class="text-3xl font-black text-slate-800">12</p>
                <span class="text-slate-400 text-xs font-bold">km/h</span>
            </div>
        </div>

        <div
            class="bg-white p-6 rounded-[2rem] border border-slate-100 shadow-sm hover:shadow-xl hover:shadow-emerald-500/5 transition-all group">
            <div
                class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
                <i class="fa-solid fa-mask-face text-xl"></i>
            </div>
            <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Air Quality</p>
            <div class="flex items-center gap-2">
                <p class="text-3xl font-black text-slate-800">Good</p>
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            </div>
        </div>

    </div>
</div>
