<section appSlideIn direction="up"
    class="relative w-full rounded-3xl p-8 bg-slate-900 dark:bg-slate-900 text-white border border-slate-800 overflow-hidden shadow-lg shadow-slate-900/10">
    <div class="absolute inset-0 bg-linear-to-r from-emerald-950/40 via-teal-950/20 to-transparent -z-10"></div>
    <div class="relative z-10 grid grid-cols-1 lg:grid-cols-12 gap-6 items-center">
        <div class="lg:col-span-8 space-y-3">
            <div
                class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-emerald-500/10 border border-emerald-400/20 text-emerald-400">
                <span class="flex h-2 w-2 relative">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>

            </div>

                <span class="font-['Pacifico'] text-5xl font-light text-emerald-500 dark:text-emerald-400"> {{userFirstName}}
                </span>
            </h1>
            <p class="text-sm text-slate-300 max-w-xl">
                Monitor, detect, and protect your plants with Zaraa's AI-powered diagnosis. Get instant insights and
                smart treatments for healthier growth.
            </p>
        </div>
        <div class="lg:col-span-4 flex justify-end">
            <a routerLink="/users/diagnosis"
                class="inline-flex items-center gap-2 px-6 py-3.5 bg-emerald-500 hover:bg-emerald-400 text-white rounded-2xl font-bold tracking-wide transition-all shadow-lg shadow-emerald-500/20">

        </div>
    </div>
