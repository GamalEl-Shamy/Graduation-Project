<header
    class="bg-white dark:bg-slate-950/95 border-b border-slate-200 dark:border-slate-800/70">

    <section
        class="xl:hidden px-4 sm:px-6 py-1 flex items-center justify-between transition-colors duration-300 shadow-sm">
        <button (click)="onToggleSidebar()"
            class="p-2.5 text-slate-500 hover:text-emerald-600 dark:text-slate-400 dark:hover:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-500/10 rounded-xl transition-all duration-300 cursor-pointer">
            <i class="fa-solid fa-bars text-lg w-5 flex justify-center"></i>
        </button>

        <div class="flex items-center gap-4">
            <button (click)="themeService.toggleTheme()"
                class="relative flex items-center w-16 h-8 p-1 rounded-full cursor-pointer mx-auto bg-slate-200 dark:bg-slate-700 border border-slate-300 dark:border-slate-600 transition-colors duration-300 shadow-inner group focus:outline-none focus:ring-2 focus:ring-emerald-500/50"
                aria-label="Toggle Theme">
                <div class="absolute left-0 right-0 flex justify-between px-2 pointer-events-none">
                    <i
                        class="fa-solid fa-sun text-[13px] text-amber-500/70 dark:text-slate-500 transition-colors duration-300"></i>
                    <i
                        class="fa-solid fa-moon text-[13px] text-slate-400 dark:text-emerald-400/70 transition-colors duration-300"></i>
                </div>

                <div class="relative z-10 flex items-center justify-center w-6 h-6 rounded-full bg-white dark:bg-slate-900 shadow-sm border border-slate-200 dark:border-slate-700 transition-transform duration-500 cubic-bezier(0.4, 0, 0.2, 1)"
                    [class.translate-x-8]="themeService.isDarkMode()">
                    @if (themeService.isDarkMode()) {
                    <i class="fa-solid fa-moon text-[11px] text-emerald-400 animate-fade-in"></i>
                    } @else {
                    <i class="fa-solid fa-sun text-[11px] text-amber-500 animate-fade-in"></i>
                    }
                </div>
            </button>

            <button routerLink="/users/settings"
                class="relative p-2.5 text-slate-500 hover:text-emerald-600 dark:text-slate-400 dark:hover:text-emerald-400 hover:bg-emerald-50 dark:hover:bg-emerald-500/10 rounded-xl transition-all duration-300 cursor-pointer">
                <i class="fa-solid fa-user-gear text-lg w-5 flex justify-center"></i>
            </button>
        </div>
    </section>

    <section class="hidden xl:flex xl:items-center xl:justify-between py-1 px-12 shadow-lg">

        <div class="flex items-center gap-4 flex-1">
            <button onclick="toggleMobileSidebar()"
                class="lg:hidden w-10 h-10 rounded-xl bg-gray-50 dark:bg-slate-800 hover:bg-emerald-50 dark:hover:bg-emerald-950/30 flex items-center justify-center border border-gray-100 dark:border-slate-700/80 text-slate-600 dark:text-slate-300"
                aria-label="Toggle Navigation Menu">
                <i class="fa-solid fa-bars-staggered"></i>
            </button>

            <div
                class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-100 dark:bg-white/5 border border-slate-200 dark:border-white/10 text-xs sm:text-sm font-medium text-slate-600 dark:text-slate-300 backdrop-blur-sm transition-colors duration-300">

                <i class="fa-regular fa-clock text-emerald-500 dark:text-emerald-400"></i>

                <span>{{ today | date:'EEEE, MMMM d, y' }}</span>

                <span class="text-slate-300 dark:text-slate-600">-</span>

                <span class="font-semibold text-emerald-600 dark:text-emerald-400">{{ today | date:'h:mm a'
                    }}</span>
            </div>
        </div>

        <div class="flex items-center gap-3 md:gap-5">
            <button
                class="md:hidden w-10 h-10 rounded-xl bg-gray-50 dark:bg-slate-800 hover:bg-emerald-50 dark:hover:bg-emerald-950/30 flex items-center justify-center text-slate-500 dark:text-slate-300 border border-gray-100 dark:border-slate-700/80"
                aria-label="Mobile Search">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>

            <button (click)="themeService.toggleTheme()" class="group relative flex items-center justify-center w-11 h-11 rounded-xl cursor-pointer
                                    border border-black/10 dark:border-white/10 bg-white dark:bg-white/5 transition-all duration-200 hover:bg-neutral-50 dark:hover:bg-white/10
                                    hover:border-black/20 dark:hover:border-white/20 hover:scale-105 active:scale-95">
                @if (themeService.isDarkMode()) {
                <i
                    class="fa-solid fa-sun text-[1rem] text-emerald-500 transition-transform duration-300 group-hover:rotate-90"></i>
                } @else {
                <i
                    class="fa-solid fa-moon text-[1rem] text-neutral-500 transition-all duration-300 group-hover:text-neutral-700 group-hover:-rotate-12"></i>
                }
            </button>


            <span class="w-px h-6 bg-gray-200 dark:bg-slate-800"></span>

            <div routerLink="/users/settings" (click)="onCloseSidebar()"
                class="group relative flex items-center gap-3 p-1 mt-1 bg-white dark:bg-slate-900 rounded-2xl hover:bg-slate-50 dark:hover:bg-slate-800 transition-all duration-300 cursor-pointer border border-slate-200/70 dark:border-slate-700/70 shadow-sm hover:shadow-md hover:-translate-y-0.5 overflow-hidden">

                <div
                    class="absolute inset-0 bg-linear-to-r from-emerald-500/0 via-emerald-500/5 to-emerald-500/0 -translate-x-full group-hover:translate-x-full transition-transform duration-1000">
                </div>

                <div
                    class="relative w-8 h-8 rounded-xl bg-linear-to-br from-emerald-400 to-emerald-600 flex items-center justify-center text-white font-bold text-xl shrink-0 leading-none shadow-inner shadow-white/20 font-['Namdhinggo'!important] capitalize ring-2 ring-emerald-100 dark:ring-emerald-900/50">
                    <span>{{char()}}</span>
                </div>

                <div class="flex-1 min-w-0 relative">
                    <p
                        class="text-base capitalize font-bold text-slate-800 dark:text-slate-100 truncate font-headline leading-tight group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors font-['Namdhinggo'!important]">
                        {{ userFirstName() }}
                    </p>
                    <p
                        class="text-[11px] uppercase tracking-wider text-slate-500 dark:text-slate-400 font-semibold truncate mt-1 flex items-center gap-1.5">
                        <span
                            class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)] animate-pulse"></span>
                        {{ userRole() }}
                    </p>
                </div>

                <div
                    class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 dark:text-slate-500 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 group-hover:bg-emerald-50 dark:group-hover:bg-emerald-500/10 transition-all duration-300 relative">
                    <i class="fa-solid fa-gear group-hover:rotate-90 transition-transform duration-500"></i>
                </div>
            </div>
        </div>
    </section>
</header>
