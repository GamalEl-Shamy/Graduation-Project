<div (click)="close()" class="fixed inset-0 z-5000 flex items-center justify-center min-h-screen bg-black/80 ">
    <div class="z5-card relative anim-pulse">
        <i class="fa-solid fa-x absolute right-4 top-4 text-white cursor-pointer" (click)="close()"></i>
        <div class="relative z-10 flex flex-col items-center w-full animate-fadeIn">

            <div class="avatar animate-avatarPop">{{ initials() }}</div>

            <p class="welcome-label">Welcome back</p>
            <h2 class="name font-bold text-xl">{{ user.firstName }} {{user.lastName}}</h2>
            <p class="role">{{ user.role }}</p>

            <hr class="divider" />

            <div class="flex gap-10 justify-center mb-6 w-full">
                    <span class="text-[15px] text-[#50ffad]">Start Free Diagnosis</span>
            </div>
            <button class="cta" (click)="close()">Go to dashboard</button>
        </div>
    </div>
</div>
