@if(cartData()) {
<div class="sticky top-5 w-full lg:w-95 bg-white rounded-2xl shadow-sm border border-gray-200 p-6 sm:p-8 ">
    <h2 class="text-xl font-bold text-gray-900 mb-6">Order Summary</h2>

    <div class="space-y-5 mb-6">

        @for (item of cartItems(); track item.productId) {
        <div class="flex items-center gap-4">
            <div
                class="w-16 h-16 overflow-hidden bg-gray-100 rounded-xl shrink-0 flex items-center justify-center text-gray-400 border border-gray-300">
                <img class="object-contain w-full" [src]="imgBaseUrl + item?.product?.mainImg" [alt]="item?.product?.name
                        ">
            </div>
            <div class="flex-1">
                <h3 class="text-sm font-bold text-gray-900 line-clamp-1">{{item?.product?.name}}</h3>
                <p class="text-sm text-gray-500 mt-0.5 font-medium">Quantity: {{item?.count}}</p>
            </div>
            <span class="text-sm font-black text-gray-900">${{item?.product?.price}}</span>
        </div>
        }

    </div>

    <div class="pt-5 border-t border-gray-100 border-dashed space-y-3">
        <div class="flex justify-between text-sm">
            <span class="text-gray-600 font-medium">Subtotal</span>
            <span class="font-bold text-gray-900">${{cartData()?.totalPrice}}</span>
        </div>
        <div class="flex justify-between text-sm">
            <span class="text-gray-600 font-medium">Shipping</span>
            <span class="text-emerald-600 font-bold bg-emerald-50 px-2 py-0.5 rounded-md">Free</span>
        </div>
    </div>

    <div class="pt-5 mt-5 border-t border-gray-200">
        <div class="flex justify-between items-end">
            <span class="text-base font-bold text-gray-900">Total</span>
            <span class="text-3xl font-black text-gray-900">${{cartData()?.totalPrice}}</span>
        </div>
    </div>

    @if (isActive()) {
    <button routerLink="shopping-details"
        class="mt-8 w-full bg-emerald-600 hover:bg-emerald-700 text-white cursor-pointer font-bold text-lg py-4 rounded-xl transition-all shadow-md hover:shadow-lg flex items-center justify-center gap-2 group">
        <i class="fa-solid fa-sack-dollar mr-3"></i>
        Proceed to Checkout
    </button>
    }
</div>
}
@else {
<app-order-summary-skeleton></app-order-summary-skeleton>
}
