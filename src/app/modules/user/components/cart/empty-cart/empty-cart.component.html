<section
    class="relative w-full bg-emerald-700/80 backdrop-blur-xl rounded-3xl mb-5 shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white/50 transition-all duration-300 hover:shadow-[0_8px_30px_rgb(0,0,0,0.08)]">
    <div class="py-3 sm:py-6 w-full relative overflow-hidden">
        <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
        <div class="absolute top-10 -left-10 w-32 h-32 bg-white/10 rounded-full blur-xl"></div>
        <div class="text-center">
            <h2 class="text-2xl md:text-4xl font-['Namdhinggo'!important] font-bold text-white">
                Personal Cart
            </h2>
        </div>
    </div>

    <div class="p-2 md:p-6 pt-0 sm:p-8 sm:pt-0">
        <div
            class="relative w-full py-10 md:py-20 px-6 sm:px-12 flex flex-col items-center justify-center text-center bg-linear-to-b from-white to-slate-50/50 dark:bg-slate-800 dark:from-slate-800 dark:to-slate-800/95 rounded-3xl border border-slate-100 dark:border-slate-700/50 shadow-[inset_0_2px_20px_rgba(0,0,0,0.02)] dark:shadow-[inset_0_2px_20px_rgba(0,0,0,0.2)] overflow-hidden">

            <div class="absolute top-0 right-0 w-64 h-64 bg-emerald-400/5 dark:bg-emerald-500/10 rounded-full blur-3xl"></div>
            <div class="absolute bottom-0 left-0 w-64 h-64 bg-amber-400/5 dark:bg-amber-500/10 rounded-full blur-3xl"></div>

            <div class="relative mb-10 group cursor-default">
                <div
                    class="absolute inset-0 bg-emerald-100/50 dark:bg-emerald-950/30 rounded-full scale-0 group-hover:scale-[1.6] transition-transform duration-700 ease-out opacity-0 group-hover:opacity-100">
                </div>

                <div
                    class="relative w-32 h-32 bg-white dark:bg-slate-700 rounded-full flex items-center justify-center shadow-[0_15px_35px_rgba(16,185,129,0.1)] dark:shadow-[0_15px_35px_rgba(0,0,0,0.3)] border border-emerald-50 dark:border-slate-600 transition-transform duration-500 group-hover:-translate-y-2 z-10">

                    <i
                        class="fa-solid fa-box-open text-5xl text-emerald-500 dark:text-emerald-400 transition-transform duration-300 group-hover:scale-110"></i>

                    <span
                        class="absolute -top-1 -right-1 bg-red-400 dark:bg-red-500 text-white text-xs font-bold rounded-full w-8 h-8 flex items-center justify-center shadow-lg border-[3px] border-white dark:border-slate-700 group-hover:bg-red-500 transition-colors">0</span>
                </div>

                <div
                    class="absolute top-1/2 -left-6 w-3 h-3 bg-red-300 dark:bg-red-400/50 rounded-full opacity-0 group-hover:opacity-100 group-hover:-translate-y-4 group-hover:-translate-x-2 transition-all duration-500 delay-100 z-0">
                </div>
                <div
                    class="absolute bottom-4 -right-4 w-4 h-4 bg-emerald-300 dark:bg-emerald-400/50 rounded-full opacity-0 group-hover:opacity-100 group-hover:-translate-y-6 group-hover:translate-x-2 transition-all duration-500 delay-200 z-0">
                </div>
            </div>

            <h1
                class="text-3xl sm:text-4xl font-extrabold text-slate-800 dark:text-slate-100 mb-4 font-['Namdhinggo'!important] tracking-tight relative z-10">
                Your cart is empty
            </h1>
            <p class="text-slate-500 dark:text-slate-400 text-sm md:text-lg leading-relaxed mb-10 max-w-md relative z-10">
                It looks like you haven't added any products yet. Browse our collections and discover something you'll
                love!
            </p>

            <div class="flex flex-col sm:flex-row items-center gap-4 relative z-10 w-full sm:w-auto">
                <button routerLink="/users/shop"
                    class="w-full sm:w-auto group inline-flex items-center justify-center gap-3 bg-emerald-600 hover:bg-emerald-700 dark:bg-emerald-500 dark:hover:bg-emerald-600 active:scale-95 text-white font-semibold text-sm md:text-lg px-8 py-4 rounded-2xl shadow-[0_8px_20px_rgba(16,185,129,0.3)] hover:shadow-[0_12px_25px_rgba(16,185,129,0.4)] transition-all duration-300 cursor-pointer overflow-hidden relative">
                    <span
                        class="absolute inset-0 w-full h-full bg-linear-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></span>
                    <i class="fa-solid fa-lines-leaning"></i>
                    Browse Products
                    <i class="fa-solid fa-angle-right"></i>
                </button>
            </div>

            <div
                class="my-8 flex items-center gap-4 text-sm text-slate-300 dark:text-slate-600 relative z-10 w-full sm:w-auto justify-center">
                <span class="h-px w-16 bg-slate-500 dark:bg-slate-600"></span>
                <span class="font-medium text-slate-500 dark:text-slate-400">OR</span>
                <span class="h-px w-16 bg-slate-500 dark:bg-slate-600"></span>
            </div>

            <div class="flex flex-col sm:flex-row items-center gap-4 relative z-10 w-full sm:w-auto">
                <button routerLink="/users/dashboard"
                    class="w-full sm:w-auto group inline-flex items-center justify-center gap-3 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 active:scale-95 text-emerald-800 dark:text-emerald-300 font-semibold text-sm md:text-lg px-8 py-4 rounded-2xl shadow-[0_8px_20px_rgba(16,185,129,0.3)] dark:shadow-[0_8px_20px_rgba(0,0,0,0.15)] hover:shadow-[0_12px_25px_rgba(16,185,129,0.4)] transition-all duration-300 cursor-pointer overflow-hidden relative">
                    <span
                        class="absolute inset-0 w-full h-full bg-linear-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></span>
                    <i class="fa-solid fa-angle-left"></i>
                    Return to dashboard
                </button>
            </div>

        </div>
    </div>
</section>
