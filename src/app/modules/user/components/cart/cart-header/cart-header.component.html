<section appSlideIn direction="up"
    class="relative overflow-hidden bg-[#020e0a] p-8 md:p-14 rounded-4xl text-white mb-10 group w-full shadow-[0_24px_60px_-15px_rgba(0,0,0,0.7)] bg-[url('/images/cart-background.png')] bg-cover bg-center bg-no-repeat transition-all duration-500">

    <!-- Overlay -->
    <div class="absolute inset-0 bg-linear-to-b md:bg-linear-to-br from-[#0b1f16]/90 via-[#123524]/50 to-[#d4b15a]/20">
    </div>

    <div class="absolute -top-32 -left-24 w-md h-112 rounded-full bg-lime-400/15 blur-[140px] pointer-events-none">
    </div>

    <div class="absolute top-0 left-1/3 w-88 h-88 rounded-full bg-amber-300/15 blur-[120px] pointer-events-none">
    </div>

    <div class="absolute bottom-0 right-0 w-120 h-120 rounded-full bg-sky-300/12 blur-[150px] pointer-events-none">
    </div>

    <div class="relative z-10 flex flex-col md:flex-row items-center justify-between gap-12 max-w-6xl mx-auto">

        <!-- LEFT: Text content -->
        <div class="flex flex-col items-center md:items-start text-center md:text-left flex-1 min-w-0">

            <div
                class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/5 backdrop-blur-md text-[#c1ecd4] border border-white/10 text-[7px] md:text-xs font-bold uppercase tracking-widest mb-6 shadow-sm">
                <span class="w-2.5 h-2.5 rounded-full bg-[#c1ecd4] relative flex">
                    <span
                        class="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 bg-[#c1ecd4]"></span>
                    <span class="relative inline-flex rounded-full h-full w-full bg-[#c1ecd4]"></span>
                </span>
                Complete Your Order
            </div>

            <h2
                class="text-3xl lg:text-6xl -mx-8 md:mx-0 font-extrabold leading-tight tracking-tight mb-4 font-headline font-[Namdhinggo]!">
                Shopping
                <span
                    class="bg-linear-to-r from-emerald-400 via-[#c1ecd4] to-teal-400 bg-clip-text text-transparent font-[Namdhinggo]! drop-shadow-[0_0_15px_rgba(16,185,129,0.25)]">
                    Cart
                </span>
            </h2>

            <p
                class="text-sm lg:text-base leading-relaxed max-w-lg font-light text-slate-100/80 md:text-emerald-50 font-['Namdhinggo',sans-serif] mb-8">
                Review your selected items, update quantities, and proceed to checkout securely to complete your
                purchase with confidence.
            </p>

            <button (click)="scrollToSecondComponent()"
                class="relative overflow-hidden inline-flex items-center justify-center gap-2.5 px-6 py-3.5 rounded-xl bg-linear-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 font-semibold text-sm transition-all duration-300 shadow-[0_8px_20px_-4px_rgba(16,185,129,0.4)] hover:shadow-[0_12px_28px_-4px_rgba(16,185,129,0.5)] hover:-translate-y-0.5 active:translate-y-0 text-white cursor-pointer w-full sm:w-auto">
                <i class="fa-solid fa-clipboard-list text-base"></i>
                <span>Complete Your Order</span>
            </button>
        </div>

        <!-- RIGHT: Animated Weather Icon -->
        <div
            class="relative w-40 h-40 md:w-56 md:h-56 shrink-0 flex items-center justify-center group-hover:scale-105 transition-transform duration-700">
            <div
                class="absolute inset-0 bg-linear-to-tr from-[#c1ecd4]/40 to-transparent rounded-[3rem] rotate-12 backdrop-blur-sm border border-white/10">
            </div>
            <div
                class="absolute inset-0 bg-linear-to-bl from-white/10 to-transparent rounded-[3rem] -rotate-6 backdrop-blur-md border border-white/20 shadow-2xl flex items-center justify-center">
                <i
                    class="fa-solid fa-basket-shopping text-7xl md:text-8xl text-[#c1ecd4] drop-shadow-[0_0_25px_rgba(193,236,212,0.4)]"></i>
            </div>
        </div>
    </div>
</section>
