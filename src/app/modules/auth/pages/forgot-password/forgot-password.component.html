<div class="relative min-h-screen flex items-center justify-center p-4 overflow-hidden bg-slate-50 dark:bg-[#0b1120]">

    <div
        class="pointer-events-none absolute top-[-10%] left-[-10%] w-xl h-144 bg-emerald-300/20 dark:bg-emerald-900/15 rounded-full blur-[120px] z-0">
    </div>
    <div
        class="pointer-events-none absolute bottom-[-10%] right-[-10%] w-xl h-144 bg-teal-200/15 dark:bg-teal-900/10 rounded-full blur-[120px] z-0">
    </div>

    <div
        class="relative z-10 w-full max-w-md bg-white/70 dark:bg-slate-800/50 backdrop-blur-xl rounded-4xl shadow-2xl shadow-slate-300/40 dark:shadow-black/50 border border-white dark:border-slate-700 p-8 sm:p-10">

        <div class="text-center mb-8">
            <div appSlideIn direction="up"
                class="w-16 h-16 bg-linear-to-br from-emerald-500 to-emerald-600 text-white rounded-2xl flex items-center justify-center mx-auto mb-5 shadow-lg shadow-emerald-500/30">
                <i class="fa-solid fa-envelope-open-text text-2xl"></i>
            </div>
            <h2 appSlideIn direction="left" class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">
                Forgot Password?</h2>
            <p appSlideIn direction="right" class="text-sm text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">
                Enter your email or username to receive a reset code.</p>
        </div>

        @if (errorMessage()) {
        <div appSlideIn direction="right"
            class="mb-5 flex items-center gap-3 p-4 bg-rose-50 dark:bg-rose-900/20 border border-rose-100 dark:border-rose-800/40 text-rose-600 dark:text-rose-400 rounded-2xl text-sm font-semibold">
            <i class="fa-solid fa-circle-exclamation text-base shrink-0"></i>
            <span>{{ errorMessage() }}</span>
        </div>
        }

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="space-y-6">
            <div>
                <label appSlideIn direction="left"
                    class="flex items-center gap-2 text-sm font-bold text-slate-700 dark:text-slate-300 mb-2">
                    <i class="fa-solid fa-user text-slate-400 dark:text-slate-500 text-xs"></i>
                    Email or Username
                </label>
                <input appSlideIn direction="right" type="text" formControlName="emailORUserName"
                    class="w-full h-12 px-4 rounded-xl border border-slate-200 dark:border-slate-700 bg-white/60 dark:bg-slate-900/40 text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all duration-200 focus:ring-2 focus:ring-emerald-500/30 focus:border-emerald-400 dark:focus:border-emerald-500 focus:outline-none hover:border-slate-300 dark:hover:border-slate-600"
                    placeholder="zaraa.ai@example.com" />
            </div>

            <button appSlideIn direction="left" type="submit" [disabled]="forgotForm.invalid || isLoading()"
                class="group w-full h-12 bg-linear-to-r from-emerald-600 to-emerald-500 hover:from-emerald-700 hover:to-emerald-600 text-white rounded-xl font-bold shadow-lg shadow-emerald-600/25 dark:shadow-emerald-950/30 transition-all duration-300 ease-out hover:-translate-y-0.5 hover:shadow-xl hover:shadow-emerald-500/40 active:translate-y-0 active:scale-95 cursor-pointer disabled:opacity-50 disabled:hover:translate-y-0 disabled:hover:shadow-lg disabled:cursor-not-allowed flex justify-center items-center gap-2">
                @if (isLoading()) {
                <i class="fa-solid fa-circle-notch fa-spin"></i> Sending...
                } @else {
                <i
                    class="fa-solid fa-paper-plane transition-transform duration-300 group-hover:translate-x-0.5 group-hover:-translate-y-0.5"></i>
                Send Reset Code
                }
            </button>

            <div appSlideIn direction="right" class="text-center pt-2">
                <a routerLink="/auth/login"
                    class="group inline-flex items-center gap-1.5 text-sm font-semibold text-slate-500 dark:text-slate-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-colors">
                    <i
                        class="fa-solid fa-arrow-left text-xs transition-transform duration-300 group-hover:-translate-x-1"></i>
                    Back to Login
                </a>
            </div>
        </form>
    </div>
</div>
