<div class="fixed inset-0 bg-gray-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-opacity duration-300"
     [class.opacity-100]="isVisible()" [class.opacity-0]="!isVisible()">

  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden transform transition-all duration-300 scale-100 relative"
       [class.scale-100]="isVisible()" [class.scale-95]="!isVisible()">

    <!-- <button class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 transition-colors">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button> -->

    <div class="p-8 text-center">
      <div class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-green-100 mb-6">
        <svg class="h-10 w-10 text-green-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
        </svg>
      </div>

      <h3 class="text-2xl font-bold text-gray-900 mb-3">Success!</h3>
      <p class="text-gray-600 mb-8 line-height-relaxed">
        {{ message() }}
      </p>

      <button routerLink="/auth/login"
              class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold cursor-pointer py-3 px-6 rounded-xl transition duration-300 shadow-md hover:shadow-lg">
        OK
      </button>
    </div>
      <div class="absolute bottom-0 left-0 h-1.5 bg-green-600 progress-bar"></div>
  </div>
</div>
