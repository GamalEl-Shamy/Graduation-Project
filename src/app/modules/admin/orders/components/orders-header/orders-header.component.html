<header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-10 gap-6 animate-float"
    style="animation: none;">
    <div class="transform translate-y-0 opacity-100 transition-all duration-1000 ease-out">
        <nav aria-label="Breadcrumb"
            class="inline-flex items-center gap-2 px-3 py-1.5 rounded-full bg-emerald-50/80 dark:bg-emerald-950/40 border border-emerald-200/50 dark:border-emerald-800/30 shadow-sm backdrop-blur-md mb-4 group cursor-pointer hover:border-emerald-300 dark:hover:border-emerald-700 transition-colors">
            <i class="fa-solid fa-seedling text-emerald-600 dark:text-emerald-400 group-hover:scale-110 transition-transform"
                aria-hidden="true"></i>
            <span class="text-xs font-bold tracking-wide text-emerald-800 dark:text-emerald-300 uppercase">
                AI Platform / Orders</span>
        </nav>
        <h1
            class="text-4xl md:text-5xl font-extrabold tracking-tight text-transparent bg-clip-text bg-linear-to-r from-emerald-800 to-teal-600 dark:from-emerald-300 dark:to-lime-200 mb-2 drop-shadow-sm">
            Orders Management
        </h1>
        <p class="text-slate-600 dark:text-slate-400 font-medium text-lg max-w-2xl flex items-center gap-2">
            <i class="ph-fill ph-leaf text-lime-500 text-base"></i>
            Manage orders, track shipments, and handle customer inquiries.
        </p>
    </div>
    <button (click)="exportToPDF()" aria-label="Export List"
        class="group relative bg-white dark:bg-slate-900/50 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700/80 px-6 py-3.5 rounded-2xl cursor-pointer font-semibold shadow-sm hover:shadow-md hover:shadow-emerald-500/10 hover:border-emerald-400 dark:hover:border-emerald-600 hover:text-emerald-700 dark:hover:text-emerald-400 transition-all duration-300 hover:-translate-y-1 backdrop-blur-sm">

        <span class="relative z-20 flex items-center gap-2">
            <i class="fa-solid fa-download text-lg text-slate-400 dark:text-slate-500 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 group-hover:translate-y-0.5 transition-all duration-300"
                aria-hidden="true"></i>
            Export PDF
        </span>
    </button>
</header>
