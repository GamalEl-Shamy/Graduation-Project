<section
    class="bg-white dark:bg-slate-900 transition-colors duration-300 rounded-3xl shadow-[0_4px_24px_rgba(0,0,0,0.02)] border border-gray-100/80 dark:border-slate-800 mt-8 py-24 px-6 flex flex-col items-center justify-center text-center opacity-0 animate-fade-in-up">
    <div
        class="w-32 h-32 bg-gray-50 dark:bg-slate-800/50 rounded-full flex items-center justify-center mb-8 relative group cursor-default">
        <div class="absolute inset-0 bg-green-100 dark:bg-green-500/20 rounded-full animate-pulse opacity-50 scale-110">
        </div>
        <div
            class="w-24 h-24 bg-green-50 dark:bg-slate-800 rounded-full flex items-center justify-center z-10 border-4 border-white dark:border-slate-900 shadow-sm group-hover:scale-105 transition-transform duration-500">
            <i [class]="icon()" class="text-4xl text-green-500 dark:text-green-400"></i>
        </div>
    </div>

    <h2 class="text-2xl md:text-3xl font-extrabold text-gray-900 dark:text-gray-100 mb-3 tracking-tight">No {{title() |
        titlecase}} Found</h2>
    <p class="text-gray-500 dark:text-gray-400 text-base max-w-md mx-auto mb-10 font-medium leading-relaxed">
        {{ subtitle() }}
    </p>

    @if (showButton()) {
    <button [routerLink]="goto()"
        class="bg-linear-to-r from-green-600 to-green-500 text-white px-8 py-3.5 rounded-2xl shadow-[0_4px_14px_0_rgba(34,197,94,0.39)] dark:shadow-[0_4px_14px_0_rgba(34,197,94,0.2)] hover:shadow-[0_6px_20px_rgba(34,197,94,0.23)] dark:hover:shadow-[0_6px_20px_rgba(34,197,94,0.3)] hover:-translate-y-0.5 transition-all duration-300 font-bold text-sm flex items-center gap-2 group cursor-pointer">
        <i class="fa-solid fa-layer-group group-hover:scale-110 transition-transform"></i>
        Add New {{title() | titlecase}}
    </button>
    }
</section>
