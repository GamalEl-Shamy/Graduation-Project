<section class="space-y-12 animate-pulse">
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-6">
        <div class="space-y-3">
            <div class="flex items-center gap-2 mb-2">
                <div class="h-4 w-20 bg-gray-200 rounded-sm"></div>
                <div class="h-4 w-4 bg-gray-200 rounded-full"></div>
                <div class="h-4 w-12 bg-gray-200 rounded-sm"></div>
            </div>
            <div class="flex items-center gap-4">
                <div class="h-12 w-80 bg-gray-200 rounded-xl"></div>
            </div>
            <div class="h-5 w-72 md:w-96 bg-gray-200 rounded-md"></div>
        </div>

            <div class="h-12 w-36 bg-gray-200 rounded-2xl"></div>
            <div class="h-12 w-40 bg-gray-200 rounded-2xl"></div>
        </div>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
        @for (item of [1,2,3,4]; track $index) {
            <div class="bg-white p-8 rounded-4xl shadow-sm border-2 border-gray-100 flex flex-col justify-between min-h-55">
            <div class="flex items-start justify-between mb-4">
                <div class="w-16 h-16 rounded-[1.25rem] bg-gray-200"></div>
            </div>
            <div class="mt-auto space-y-3">
                <div class="h-10 w-20 bg-gray-200 rounded-lg"></div>
                <div class="h-4 w-28 bg-gray-200 rounded-md"></div>
            </div>
        </div>
        }
    </div>
</section>
